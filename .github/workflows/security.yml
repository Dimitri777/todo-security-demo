name: CI + Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # 1. SAST — статический анализ кода (Bandit + Semgrep)
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SAST tools
        run: pip install bandit semgrep
      - name: Run Bandit
        run: bandit -r app -f json -o bandit-report.json || true
      - name: Run Semgrep (public security ruleset)
        run: semgrep --config p/security-audit --config p/flask --json --output semgrep-report.json app || true
      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json

  # ---------------------------------------------------------------------
  # 2. SCA — анализ уязвимостей зависимостей (pip-audit)
  # ---------------------------------------------------------------------
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit against requirements
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json || true
      - name: Upload SCA report
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: pip-audit-report.json

  # ---------------------------------------------------------------------
  # 3. IAST — runtime-мониторинг во время прогона тестов
  # ---------------------------------------------------------------------
  iast-demo:
    name: IAST (демо runtime-мониторинга)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run app in background and send sample traffic
        run: |
          python -m app.app &
          sleep 3
          curl -s "http://localhost:5000/health"
          curl -s -X POST "http://localhost:5000/todos" \
            -H "Content-Type: application/json" \
            -d '{"title": "<script>alert(1)</script>"}'
          curl -s "http://localhost:5000/todos?debug=<script>alert(2)</script>" > /dev/null
        continue-on-error: true
      - name: Note
        run: echo "Логи toy-IAST middleware см. в выводе шага выше (логгер toy_iast)."